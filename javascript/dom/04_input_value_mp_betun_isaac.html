<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input value - Isaac Betun</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Calculadora de puntos</h1>
    <label>Victorias: <input type="number" id="victorias" min="0" value="0"></label><br>
    <label>Empates: <input type="number" id="empates" min="0" value="0"></label><br>
    <label>Torneo:
        <select id="torneo">
            <option value="Liga">Liga</option>
            <option value="Copa">Copa</option>
        </select>
    </label><br>
    <label><input type="checkbox" id="local"> Jugó de local</label><br>
    <button id="calcular">Calcular</button>
    <p id="resultado"></p>
    <p>Autor: Isaac Betun</p>
    <script src="04_input_value_mp_betun_isaac.js"></script>
</body>
</html>
