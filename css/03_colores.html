<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores CSS - Isaac Betun</title>
    <style>
        body {
            background-color: #0a1f44;
        }

        h1 {
            color: lightskyblue;
        }

        h2 {
            color: #ffffff;
        }

        h3 {
            color: rgb(201, 162, 39);
        }

        h4 {
            color: rgba(165, 0, 68, 0.9);
        }

        h5 {
            color: hsl(200, 70%, 70%);
        }
    </style>
</head>
<body>
    <h1>Maneras de establecer colores - Lionel Messi</h1>
    <h2>Hexadecimal: #ffffff</h2>
    <h3>RGB: rgb(201, 162, 39)</h3>
    <h4>RGBA: rgba(165, 0, 68, 0.9)</h4>
    <h5>HSL: hsl(200, 70%, 70%)</h5>
    <p style="color: lightskyblue;">Por nombre del color: lightskyblue</p>
</body>
</html>
