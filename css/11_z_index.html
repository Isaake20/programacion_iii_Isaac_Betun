<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
    <link rel="stylesheet" href="11_z_index.css">
</head>
<body>
    <h1>Capas de Lionel Messi</h1>
    <h2>Uso de propiedad z-index</h2>
    <div class="escenario">
        <div class="capa barcelona">FC Barcelona<br>z-index: 1</div>
        <div class="capa argentina">Selección Argentina<br>z-index: 3</div>
        <div class="capa miami">Inter Miami<br>z-index: 2</div>
    </div>

    <h2>Tarjeta con etiqueta encima</h2>
    <div class="tarjeta">
        <span class="sello">CAMPEÓN</span>
        <h3>Mundial Catar 2022</h3>
        <p>Argentina vence a Francia en la final</p>
    </div>
</body>
</html>
