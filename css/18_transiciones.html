<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transiciones</title>
    <link rel="stylesheet" href="18_transiciones.css">
</head>
<body>
    <main>
        <h1>Transiciones de Messi</h1>

        <h2>Botones</h2>
        <button class="boton">Ver goles</button>
        <button class="boton boton-jedi">Ver títulos</button>

        <h2>Tarjeta</h2>
        <div class="tarjeta">
            <h3>Lionel Messi</h3>
            <p>Ocho veces Balón de Oro</p>
        </div>

        <h2>Radar</h2>
        <div class="radar">
            <span class="indicador">➤</span>
        </div>

        <h2>Vestuario</h2>
        <div class="hangar">
            <div class="nave">Botín</div>
        </div>
        <div class="hangar">
            <div class="nave2">Balón</div>
        </div>

        <h1>Jugada de entrenamiento</h1>
        <div class="espacio">
            <div class="xwing">Balón</div>
        </div>

        <div class="espacio2">
            <div class="xwing2">Balón 2</div>
        </div>
    </main>
</body>
</html>
