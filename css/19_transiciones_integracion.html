<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transiciones e integración</title>
    <link rel="stylesheet" href="19_transiciones_integracion.css">
</head>
<body>
    <header>
        <h1>Noche de Messi en el Camp Nou</h1>
        <p>Simulación de una jugada con transiciones y animaciones.</p>
    </header>

    <main>
        <section class="cancha" aria-label="Cancha animada">
            <div class="luz luz1"></div>
            <div class="luz luz2"></div>
            <div class="luz luz3"></div>
            <div class="luz luz4"></div>
            <div class="luz luz5"></div>

            <div class="balon">
                <span aria-hidden="true">⚽</span>
                <p>Balón</p>
            </div>

            <div class="marcador">GOOOL</div>
        </section>

        <section class="controles">
            <h2>Centro de análisis</h2>
            <div class="panel">
                <article class="radar-contenedor">
                    <h3>Radar de jugada</h3>
                    <div class="radar" aria-hidden="true">
                        <div class="pulso"></div>
                        <div class="centro"></div>
                    </div>
                </article>

                <article class="estado">
                    <h3>Ficha del jugador</h3>
                    <p>Jugador: Lionel Messi</p>
                    <p>Camiseta: 10</p>
                    <p>Selección: Argentina</p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>Práctica de CSS - Isaac Betun - 2026</p>
    </footer>
</body>
</html>
