<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectores CSS - Isaac Betun</title>
    <link rel="stylesheet" href="02_selectores.css">
    <style>
        h2 {
            color: #0b5ed7;
        }

        #titulo-principal {
            color: #75aadb;
            text-align: center;
        }

        #sub-titulo {
            color: #a50044;
            text-align: left;
        }

        .barcelona {
            color: #a50044;
        }

        .argentina {
            color: #75aadb;
        }
    </style>
</head>
<body>
    <h1>Selectores para asignar estilos</h1>
    <h2>Selector por etiqueta</h2>

    <h1>Selector por id</h1>
    <h1 id="titulo-principal">Lionel Messi</h1>
    <h2 id="sub-titulo">El mejor de su generación</h2>

    <h1>Selector por clase</h1>
    <h3 class="barcelona">FC Barcelona</h3>
    <h3 class="argentina">Selección Argentina</h3>
    <h3 class="barcelona">Copa del Rey</h3>
    <h3 class="argentina">Copa del Mundo 2022</h3>

    <h1>Selectores agrupados y descendientes</h1>
    <nav>
        <a href="https://www.afa.com.ar" target="_blank">Sitio oficial de la AFA</a>
    </nav>
    <h4>Rosario</h4>
    <h5>Barcelona</h5>
    <h6>Miami</h6>
</body>
</html>
