<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
</head>
<body>
    <h1>Utilización de la etiqueta Img</h1>
    <img
        src="images/messi.webp"
        alt="Lionel Messi"
        width="300"
        height="350"
        loading="eager"
    >

    <img
        src="images/personajes/messi_copa_mundo.jpeg"
        alt="Lionel Messi con la Copa del Mundo"
        width="500"
        height="350"
        loading="eager"
    >

    <img
        src="images/personajes/messi_argentina.jpeg"
        alt="Lionel Messi con la selección argentina"
        width="300"
        height="350"
        loading="lazy"
    >

    <figure>
        <img
            src="../images/messi1.jpeg"
            alt="Lionel Messi"
            width="500"
            height="350"
            loading="eager"
        >
        <figcaption>
            Lionel Messi, campeón del mundo con Argentina
        </figcaption>
    </figure>
</body>
</html>
