<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controles - Isaac Betun</title>
</head>
<body>
    <h1>Lionel Messi</h1>
    <h1>Autor: Isaac Betun</h1>

    <h2>Controles de formulario</h2>
    <form action="#" method="post">
        <p><label>Color de la camiseta: <input type="color" name="color" value="#75aadb"></label></p>
        <p><label>Nivel de entusiasmo: <input type="range" name="nivel" min="0" max="10" value="8"></label></p>
        <p><label>Foto: <input type="file" name="foto" accept="image/*"></label></p>
        <p><label>Sitio web: <input type="url" name="web" placeholder="https://"></label></p>
        <p><label>Teléfono: <input type="tel" name="telefono"></label></p>
        <p><label>Buscar: <input type="search" name="busqueda"></label></p>
        <p><label>Hora del partido: <input type="time" name="hora"></label></p>
        <input type="hidden" name="origen" value="practica12">
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
