<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatos de texto</title>
</head>
<body>
    <h1>Formatos de texto</h1>
    <p id="primer_subtitulo"><b>Texto en negrita</b></p>
    <p><strong>Texto importante (strong)</strong></p>
    <p><i>Texto en cursiva</i></p>
    <p><em>Texto enfatizado (em)</em></p>
    <p><u>Texto subrayado</u></p>
    <p><mark>Texto resaltado</mark></p>
    <p><small>Texto pequeño</small></p>
    <p><del>Texto tachado</del> <ins>Texto insertado</ins></p>
    <p id="segundo_subtitulo">H<sub>2</sub>O y x<sup>2</sup></p>
</body>
</html>
