<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios - Isaac Betun</title>
</head>
<body>
    <h1>Lionel Messi</h1>
    <h1>Autor: Isaac Betun</h1>

    <h2>Inscripción al club de fans</h2>
    <form action="#" method="post">
        <fieldset>
            <legend>Datos personales</legend>
            <p><label for="nombre">Nombre:</label>
               <input type="text" id="nombre" name="nombre" required></p>
            <p><label for="correo">Correo:</label>
               <input type="email" id="correo" name="correo" required></p>
            <p><label for="edad">Edad:</label>
               <input type="number" id="edad" name="edad" min="5" max="100"></p>
            <p><label for="nacimiento">Fecha de nacimiento:</label>
               <input type="date" id="nacimiento" name="nacimiento"></p>
        </fieldset>
        <fieldset>
            <legend>Preferencias</legend>
            <p>Jugador favorito:
               <label><input type="radio" name="fav" value="messi" checked> Messi</label>
               <label><input type="radio" name="fav" value="otro"> Otro</label></p>
            <p><label><input type="checkbox" name="partidos" value="barca"> Partidos del Barcelona</label>
               <label><input type="checkbox" name="partidos" value="arg"> Partidos de Argentina</label></p>
            <p><label for="pais">País:</label>
               <select id="pais" name="pais">
                   <option value="ec">Ecuador</option>
                   <option value="ar">Argentina</option>
                   <option value="es">España</option>
               </select></p>
        </fieldset>
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </form>
</body>
</html>
