<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Messi</title>
</head>
<body>
    <h1>Registro de fan de Messi</h1>
    <form action="/registro" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Lionel" required>
        <br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" placeholder="Ej. Messi" required>
        <br><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="confirmar">Confirmar contraseña:</label>
        <input type="password" id="confirmar" name="confirmar" required>
        <br><br>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="1" required>
        <br><br>

        <label for="nivel">Nivel de habilidad futbolística:</label>
        <input type="number" id="nivel" name="nivel" min="10" max="100" value="50" step="5">
        <br><br>

        <label for="habilidades">Seleccione su habilidad principal:</label>
        <select name="habilidades" id="habilidades">
            <option value="regate">Regate</option>
            <option value="tiros_libres">Tiros libres</option>
            <option value="asistencias">Asistencias</option>
        </select>
        <br><br>

        <label for="equipo">Seleccione su equipo favorito:</label>
        <select name="equipo" id="equipo">
            <option value="barcelona">FC Barcelona</option>
            <option value="argentina">Selección Argentina</option>
            <option value="inter_miami">Inter Miami</option>
        </select>
        <br><br>

        <label for="ciudad">Ciudad de origen:</label>
        <input type="text" id="ciudad" name="ciudad" required>
        <br><br>

        <fieldset>
            <legend>Datos generales:</legend>
            <label for="masculino">Masculino</label>
            <input type="radio" id="masculino" name="genero" value="masculino">
            <label for="femenino">Femenino</label>
            <input type="radio" id="femenino" name="genero" value="femenino">
            <label for="otro">Otro</label>
            <input type="radio" id="otro" name="genero" value="otro">
        </fieldset>
        <br>

        <button type="reset">Reset</button>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
