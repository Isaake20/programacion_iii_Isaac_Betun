# Perfil de pruebas: base H2 en memoria para que el pipeline no dependa de PostgreSQL
spring.datasource.url=jdbc:h2:mem:estacionamiento_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.notificacion.demora-ms=0
