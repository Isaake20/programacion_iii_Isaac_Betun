spring.application.name=estacionamiento-api
server.port=8080

# ===== Base de datos PostgreSQL =====
# Se pueden sobreescribir con variables de entorno (DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estacionamiento_db}
spring.datasource.username=${DB_USER:estacionamiento}
spring.datasource.password=${DB_PASSWORD:estacionamiento123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Zona horaria =====
spring.jackson.time-zone=America/Guayaquil
spring.jpa.properties.hibernate.jdbc.time_zone=America/Guayaquil

# ===== Logs =====
logging.level.com.isaacbetun.estacionamiento=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n
